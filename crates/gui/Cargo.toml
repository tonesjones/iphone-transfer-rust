[package]
name = "photoxfer-gui"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "photoxfer-desktop"
path = "src/main.rs"

[dependencies]
photoxfer-core = { path = "../core" }
anyhow.workspace = true
clap.workspace = true
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"] }

[target.'cfg(windows)'.dependencies]
# Already in Cargo.lock through eframe; named here to read the window handle for the title bar.
raw-window-handle = "0.6.2"
windows = { workspace = true, features = ["Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
